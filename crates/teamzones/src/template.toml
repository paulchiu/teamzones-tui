## teamzones configuration
##
## Every key teamzones reads is below, behind a single # and showing its default or an example,
## so this file behaves exactly like no file until a line is uncommented. Lines starting with ##
## are prose and stay comments. `teamzones config check` validates the result.
##
## Without a [home], home is the system time zone with no hours, and there are no people,
## places or groups. Once any table is uncommented, [home] is required.

## Day and night come from local sunrise and sunset ("sun"), or from a fixed 6am-6pm ("clock").
# [bands]
# source = "sun"

## You. Home is the axis zone, the zone typed times are read in, and the first entry in every
## copy. Give a city from the bundled list, or label, tz and at = [lat, lon] for one it lacks.
# [home]
# name = "Kim"
# city = "Melbourne"
# hours = "9am-6pm"
# days = "Mon-Fri"

## Someone you tell. hours is a range or the name of an hours profile, and days defaults to
## Mon-Fri. A person without hours is reachable in daylight.
# [[person]]
# name = "Alex"
# city = "Johannesburg"
# hours = "office"

## A region you operate in, with one zone and an optional trading profile.
# [[place]]
# name = "UK"
# tz = "Europe/London"
# trading = "venue"
# at = [54.5, -2.5]

## A named weekly schedule on a local clock: kind = "hours" (office hours) or "trading" (open
## hours and peaks, with [[profile.on]] entries overriding them on some days). labels names its
## places' three levels on screen and in copy, such as open = "trading hours".
# [[profile]]
# name = "office"
# kind = "hours"
# hours = "8am-4pm"
# days = "Mon-Fri"

# [[profile]]
# name = "venue"
# kind = "trading"
# open = "7am-11pm"
# peak = ["11:30am-2pm", "5:30-9pm"]
# labels = { closed = "closed", open = "open", busy = "busy" }
# [[profile.on]]
# days = "Fri-Sat"
# peak = ["11:30am-2:30pm", "6-10pm"]

## A named, ordered list of people and places, numbered 1-9 in file order. It asks who when it
## lists people, and where when it lists places. where is "open" (not busy), "closed" or
## "context"; the older "off-peak" and "quiet" still work.
# [[group]]
# name = "crew"
# aliases = ["c"]
# people = ["Alex"]
# places = ["UK"]
# where = "open"

## Whether the map shows: "auto" hides it when the terminal is too small.
# [map]
# show = "auto"

## A dated travel override, written by `teamzones here`. It is active through the end of until
## in that city's local date.
# [travel]
# here = "London"
# until = 2026-11-01

## scheme is "dark", "light" or "mono", and glyphs is "full" or "ascii". Any colour role can be
## overridden by its name as #rrggbb, such as accent = "#0969da".
# [theme]
# scheme = "dark"
# glyphs = "full"

## Copy-as formats: the c dialog lists each one with its key, a preview and its label. These are
## the built-ins. A [[copy]] with a built-in key replaces it, hide = true removes it, and a new key
## adds a format. who is "marked", "all" or "focused-first" (the focused row's time, then yours),
## and places is "states", "zones" or "none". The one default = true format is the line in the
## times box, what y copies and what `teamzones say` prints, so it cannot be "focused-first".
# [[copy]]
# key = "y"
# label = "the times"
# who = "marked"
# date = false
# names = false
# places = "states"
# default = true

# [[copy]]
# key = "d"
# label = "with the date"
# who = "marked"
# date = true
# names = false
# places = "states"

# [[copy]]
# key = "w"
# label = "with names"
# who = "marked"
# date = false
# names = true
# places = "states"

# [[copy]]
# key = "t"
# label = "the focused row's time first"
# who = "focused-first"
# date = false
# names = false
# places = "none"

# [[copy]]
# key = "z"
# label = "with each place's time instead of its state"
# who = "marked"
# date = false
# names = false
# places = "zones"

# [[copy]]
# key = "s"
# label = "times only"
# who = "marked"
# date = false
# names = false
# places = "none"

# [[copy]]
# key = "a"
# label = "for everyone"
# who = "all"
# date = false
# names = false
# places = "states"
