name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  quality-check:
    name: Format, Lint, Test & Build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # The justfile owns what CI means: format, lint, test, docs, core isolation
      # and build. Duplicating the steps here would let the two drift apart.
      - name: Format, Lint, Test & Build
        run: just ci

  msrv:
    name: MSRV
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      # The recipe reads the floor out of the manifest, so the version Cargo
      # promises and the version this job proves cannot drift apart.
      - name: Build and test against the declared floor
        run: just msrv

  workflows:
    name: Workflow parse
    # Linux only, because the recipe needs PyYAML and `just ci` runs on a laptop too.
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Parse every workflow
        run: just workflows

  # One required status check, so nothing outside this file changes when a job is added above.
  ci:
    name: CI
    if: always()
    needs: [quality-check, msrv, workflows]
    runs-on: ubuntu-26.04
    steps:
      - run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
