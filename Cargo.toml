[workspace]
resolver = "3"
members = ["crates/teamzones-core", "crates/teamzones"]

[workspace.lints.rust]
unsafe_code = "deny"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }

# Curated rather than clippy::pedantic/clippy::nursery wholesale: those groups measured
# at 803 warnings on blubat, dominated by cosmetic ones that would bury real findings.
# Priorities sit above the groups' implicit 0 so these hold if a group is turned on later.
[workspace.lints.clippy]
redundant_clone = { level = "deny", priority = 1 }
needless_collect = { level = "deny", priority = 1 }
map_unwrap_or = { level = "deny", priority = 1 }
manual_ok_or = { level = "deny", priority = 1 }
clone_on_copy = { level = "deny", priority = 1 }
needless_borrow = { level = "deny", priority = 1 }
large_enum_variant = { level = "deny", priority = 1 }
unnecessary_wraps = { level = "deny", priority = 1 }
assigning_clones = { level = "deny", priority = 1 }
semicolon_if_nothing_returned = { level = "deny", priority = 1 }
explicit_iter_loop = { level = "deny", priority = 1 }
needless_continue = { level = "deny", priority = 1 }
ignored_unit_patterns = { level = "deny", priority = 1 }
redundant_closure_for_method_calls = { level = "deny", priority = 1 }
ptr_as_ptr = { level = "deny", priority = 1 }
borrow_as_ptr = { level = "deny", priority = 1 }
format_collect = { level = "deny", priority = 1 }
single_option_map = { level = "deny", priority = 1 }
needless_pass_by_value = { level = "deny", priority = 1 }
missing_errors_doc = { level = "deny", priority = 1 }

[workspace.package]
version = "0.6.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
authors = ["Paul Chiu"]
repository = "https://github.com/paulchiu/teamzones-tui"
homepage = "https://github.com/paulchiu/teamzones-tui"
keywords = ["timezone", "tui", "cli", "scheduling"]
categories = ["command-line-utilities"]

# Every shared dependency is declared here, so a milestone that starts using one
# touches only its crate's manifest and the root lockfile.
[workspace.dependencies]
teamzones-core = { path = "crates/teamzones-core" }
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
# Format preserving, so writing a group back leaves the comments and key order of a
# hand-written config exactly where they were.
toml_edit = "0.25"
thiserror = "2"
ratatui = "0.30"
crossterm = "0.29"
clap = { version = "4.6", features = ["derive"] }
arboard = "3"
etcetera = "0.11"
iana-time-zone = "0.1"
color-eyre = "0.6"
assert_cmd = "2"
insta = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
